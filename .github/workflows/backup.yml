name: STGR Wiki Backup

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests pynacl

      - name: Run backup
        env:
          ATWIKI_CLIENT_ID: ${{ secrets.ATWIKI_CLIENT_ID }}
          ATWIKI_CLIENT_SECRET: ${{ secrets.ATWIKI_CLIENT_SECRET }}
          ATWIKI_REFRESH_TOKEN: ${{ secrets.ATWIKI_REFRESH_TOKEN }}
          STGR_GITHUB_PAT: ${{ secrets.STGR_GITHUB_PAT }}
        run: python backup.py

      - name: Commit changes
        run: |
          git config user.name "STGR Wiki Backup"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update STGR Wiki backup"
            git push
          fi
